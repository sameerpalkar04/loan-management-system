spring.application.name=auth-service
server.port=8000

spring.datasource.url=${AUTH_DB_URL:jdbc:oracle:thin:@//localhost:1521/freepdb1}
spring.datasource.username=system
spring.datasource.password=root
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Development only. Replace with Flyway migrations before production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Base64 encoding of a random key at least 32 bytes long. Do not place its value in this file.
auth.jwt.secret=Ms2+3M3mvlMz5TNpd5lzvkwpnY0PPQH/tr8wz0qByTo=
auth.jwt.issuer=loan-auth-service
auth.jwt.access-token-expiry-seconds=${AUTH_JWT_EXPIRY_SECONDS:3600}

management.endpoints.web.exposure.include=health,info
