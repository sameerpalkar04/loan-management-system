spring.application.name=api-gateway
server.port=9000
spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

spring.cloud.gateway.server.webflux.routes[0].id=loan-officer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://LOAN-OFFICER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/loan-officer/**
